# The local services of BUILD-PLAN §6.3 on the runner: Postgres 17 behind Neon's local proxy
# (compose.yaml, pinned by digest), migrated and seeded, with the demo dealer as ci.yml's
# DEMO_MODE and DEALER_SLUG ask, and this run's own secrets for Better Auth, the rate-limit keys
# and the local store. The secrets are random and masked, and nothing here reaches a real service.
name: Local services
description: The local database, migrated and seeded, and secrets made for this run
runs:
  using: composite
  steps:
    - name: Secrets for this run
      shell: bash
      run: |
        set -euo pipefail
        auth_secret="$(openssl rand -base64 32)"
        rate_limit_secret="$(openssl rand -base64 32)"
        store_token="vercel_blob_rw_local_$(openssl rand -hex 16)"
        echo "::add-mask::${auth_secret}"
        echo "::add-mask::${rate_limit_secret}"
        echo "::add-mask::${store_token}"
        {
          echo "BETTER_AUTH_SECRET=${auth_secret}"
          echo "RATE_LIMIT_HMAC_SECRET=${rate_limit_secret}"
          echo "BLOB_READ_WRITE_TOKEN=${store_token}"
        } >> "$GITHUB_ENV"
    - name: Database
      shell: bash
      run: pnpm db:up && pnpm db:migrate && node scripts/seed.ts
