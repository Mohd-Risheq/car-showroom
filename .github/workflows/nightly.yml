# Nightly on main (SRS §16.2): OSV-Scanner on the lockfile and gitleaks over the full history again,
# with pnpm audit and the SEC-11 version floor, so an advisory published after a merge still
# reaches the owner (SEC-11's advisory response). An accepted advisory past its review date fails
# here too. Actions are pinned by commit SHA (SEC-11).
name: Nightly supply chain

on:
  schedule:
    # 01:00 UTC, 04:00 in Amman
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A run started by hand while the nightly one is going waits for it rather than racing it
concurrency:
  group: nightly-supply-chain
  cancel-in-progress: false

jobs:
  supply-chain:
    name: Supply chain (pnpm audit:deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads every commit
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/scanners
      - uses: ./.github/actions/setup
      - run: pnpm audit:deps
