# The quality gates of SRS §16.2 and the pull-request pipeline of SRS §17.2, in the order SRS §16.2
# gives them: gitleaks and the supply chain first, so a leaked secret or a known-vulnerable
# dependency stops the run before anything else installs or runs. CodeQL (step 8) is codeql.yml.
# Every job reads the repository only; actions are pinned by commit SHA (SEC-11).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The local services of BUILD-PLAN §6.3, never a real one: Postgres behind Neon's local proxy, whose
# credentials are compose.yaml's, and the local storage adapter. The secrets are made per run
# (.github/actions/local-services). The site's dealer is the seed's demo dealer: the public pages
# read theirs by DEALER_SLUG, so the build and the journeys need its row, which the local services
# seed (D-047).
env:
  DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/main
  DATABASE_URL_UNPOOLED: postgres://postgres:postgres@db.localtest.me:5432/main
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  STORAGE_DRIVER: local
  NEXT_PUBLIC_VERCEL_BLOB_API_URL: http://localhost:3000/api/storage-local?
  DEMO_MODE: "true"
  DEALER_SLUG: muftah

jobs:
  gates:
    name: Gates (SRS §16.2 steps 1 to 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads every commit
          fetch-depth: 0
          persist-credentials: false

      # Step 1: secrets, then the frozen install, then pnpm audit, OSV-Scanner and the version floor
      - uses: ./.github/actions/scanners
      - name: gitleaks
        run: gitleaks git --no-banner --redact
      - uses: ./.github/actions/setup
      - name: Supply chain (pnpm audit:deps)
        run: pnpm audit:deps

      # Step 2, with the tokens' colour pairs since T-13 (BUILD-PLAN §6.2)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:i18n
      - run: pnpm check:dashes
      - run: pnpm check:contrast
      - run: pnpm check:seed
      - run: pnpm db:check

      # Step 3. The scripts name their reporters, which leaves out Vitest's GitHub one, so it's added
      # here: a failed test then shows on the run as an annotation, with its file, line and message.
      - uses: ./.github/actions/local-services
      - run: pnpm test --reporter=github-actions
      - run: pnpm test:int --reporter=github-actions

      # Step 4
      - run: pnpm build
      - run: pnpm check:bundle

  # Steps 5 and 6 in parts on runners at once, as many as the matrix lists, so the suite ends within
  # the limit as it grows (D-049). The matrix alone sets the count, which each part's name and shard
  # read. Each part runs to its end, so one run reports every failure.
  e2e:
    name: E2E, axe and visual, part ${{ matrix.part }} of ${{ strategy.job-total }} (SRS §16.2 steps 5 and 6)
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-services
      - run: pnpm build

      # Journeys, axe and the visual comparison, with the browsers in Playwright's image pinned by
      # digest, where the approved baselines come from (D-037)
      - run: pnpm e2e:linux --shard=${{ matrix.part }}/${{ strategy.job-total }}

      # The part's results, with their traces and screenshots, for the report job
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-part-${{ matrix.part }}
          path: blob-report/
          retention-days: 1

  # The parts' results as one HTML report, whichever of them failed
  e2e-report:
    name: E2E report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-part-*
          path: blob-report
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14

  # Step 7 on a runner of its own, beside the end-to-end parts, so a run reports every gate.
  # Lighthouse drives Playwright's own Chromium on the runner, and each page's runs show on the run
  # as annotations (scripts/lhci.ts).
  lighthouse:
    name: Lighthouse (SRS §16.2 step 7)
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/local-services
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lhci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          # .lighthouseci is a hidden folder, which the action leaves out unless told otherwise
          include-hidden-files: true
          retention-days: 14
