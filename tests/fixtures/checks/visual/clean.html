<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual baseline</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #f4f5f7;
        color: #1b1f24;
        font: 16px/1.5 sans-serif;
      }
      main {
        max-width: 248px;
        padding: 24px;
        border-radius: 12px;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 16px;
      }
      button {
        padding: 12px 24px;
        border: 0;
        border-radius: 8px;
        background: #1f5fbf;
        color: #ffffff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Visual baseline</h1>
      <p>The approved look of a page. A visible change to it fails the comparison.</p>
      <button type="button">Save</button>
    </main>
  </body>
</html>
