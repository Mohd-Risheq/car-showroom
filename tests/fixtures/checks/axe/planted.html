<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Planted axe issues</title>
  </head>
  <body>
    <main>
      <h1>Planted axe issues</h1>
      <!-- Planted: an image with no text alternative (image-alt, critical) -->
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="40" height="40" />
      <!-- Planted: a button with no name (button-name, critical) -->
      <button type="button"></button>
      <!-- Planted: grey on grey, about 1.3:1 (color-contrast, serious) -->
      <p style="color: #777777; background: #888888">Hard to read</p>
      <!-- Planted: a field with no label (label, critical) -->
      <input type="text" />
    </main>
  </body>
</html>
